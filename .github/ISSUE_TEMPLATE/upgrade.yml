---
name: "Report issue on Upgrade to new version"
description: "Report a bug that appeared on an existing integration when upgrading to a new version of HA or this component."
labels: ["bug"]
body:
- type: markdown
  attributes:
    value:  |
      If your integration is NOT created successfully, then you should open a [Config Flow Discovery Issue](https://github.com/NicoIIT/ha-ble-adv/issues/new?template=discovery.yml) instead.

      If your integration was already not working with previous versions, please open a [Bug Report](https://github.com/NicoIIT/ha-ble-adv/issues/new?template=bug.yml) instead.

      > [!CAUTION]
      > As a remainder you are asking for help that the maintainer will happily provide if:
      > * you already carefully checked the doc and Release Notes and have not found the answer to your issue
      > * your issue contains the requested info needed by the maintainer to be able to investigate it.
      >
      > If it is not the case the issue will be **immediately closed** referring to one of the [rejection reasons](https://github.com/NicoIIT/ha-ble-adv/wiki/Why-was-my-issue-rejected%3F).

- type: textarea
  attributes:
    label: "Describe the issue"
    description: "A clear and concise description of what the issue is. 'It does not work' is not a valid description. Do not hesitate to add screenshots of the errors you are facing."
  validations:
    required: true

- type: textarea
  attributes:
    label: "Diagnostics dump when FAILING"
    description: |
      Drag the integration [diagnostic dump](https://www.home-assistant.io/integrations/diagnostics/) generated just after having reproduced the scenario of your issue AND resulting in FAILURE.
  validations:
    required: true

- type: textarea
  attributes:
    label: "Diagnostics dump when WORKING"
    description: |
      Drag the integration [diagnostic dump](https://www.home-assistant.io/integrations/diagnostics/) generated with Previous versions of HA / this component just after having reproduced the scenario of your issue AND WORKING.
  validations:
    required: true

- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I **_CAREFULLY_** read the [Contribution Guidelines](../CONTRIBUTING.md) of the project and this issue fully complies with them.
        required: true
      - label: I **_CAREFULLY_** checked the [troubleshooting guide](https://github.com/NicoIIT/ha-ble-adv/wiki/Troubleshooting-Guide) and the [configuration guide](https://github.com/NicoIIT/ha-ble-adv/wiki/Configuration-Guide) and it did not solve my issue
        required: true
      - label: I provided ALL mandatory info and in the requested format because I know that in the countrary the maintainer will not help.
        required: true
      - label: This issue only contains 1 issue (if you have multiple issues, open one issue for each issue).
        required: true
      - label: This issue is not a duplicate issue of any [previous issues](https://github.com/NicoIIT/ha-ble-adv/issues?q=is%3Aissue%20state%3Aopen%20label%3Abug).
        required: true
